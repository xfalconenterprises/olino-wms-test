# Olino WMS behind Nginx with HTTPS, on the same Ubuntu server as the app.
#
# 1. In backend/.env add HOST=127.0.0.1 (keep PORT=4000) and restart olino-wms, so the app is
#    reachable only through Nginx.
# 2. Certificate: the server is on the local network, so use a certificate from your own small
#    certificate authority (for example mkcert), made for the name or IP address staff will type,
#    and install that authority on every PC and touch terminal. Otherwise browsers show a warning.
#    Put the files at the two paths below (readable by root only).
# 3. Install:
#      sudo cp deploy/nginx-olino-wms.conf /etc/nginx/sites-available/olino-wms
#      sudo ln -s /etc/nginx/sites-available/olino-wms /etc/nginx/sites-enabled/olino-wms
#      sudo rm -f /etc/nginx/sites-enabled/default
#      sudo nginx -t && sudo systemctl reload nginx
# 4. Firewall: allow 80 and 443 from the warehouse network; port 4000 needs no rule any more.
#
# Replace wms.olino.local below with the name or IP address staff will use.

server {
    listen 80;
    server_name wms.olino.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name wms.olino.local;

    ssl_certificate     /etc/ssl/olino/wms.crt;
    ssl_certificate_key /etc/ssl/olino/wms.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Turn on once every PC and terminal trusts the certificate; after that, browsers refuse plain HTTP
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # Direct Inward drafts can be up to 2 MB
    client_max_body_size 3m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The app's login limit uses this. It is set, not appended, so a browser can't fake it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
